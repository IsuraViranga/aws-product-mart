# CloudMart — Local Development Environment
# Run: docker compose up --build
# Access: http://localhost:3000

services:
  # ---- Product Service (Python/Flask) ----
  product-service:
    build: ./services/product-service
    container_name: cloudmart-product
    ports:
      - "8001:8001"
    # LOCAL DEVELOPMENT ONLY. Mounts your workstation's AWS credentials into the
    # container read-only, because a container cannot see your home directory.
    # This has no production equivalent: on AWS the container gets its
    # credentials from an attached IAM role (EC2 instance profile / EKS IRSA),
    # and this whole block goes away.
    volumes:
      - type: bind
        source: ${USERPROFILE}/.aws
        target: /aws
        read_only: true
    environment:
      - PORT=8001
      - FLASK_DEBUG=true
      - STORE_BACKEND=dynamodb         # memory | dynamodb | firestore | cosmosdb
      - AWS_REGION=${AWS_REGION}
      - DYNAMODB_TABLE=${DYNAMODB_TABLE}
      - AWS_SHARED_CREDENTIALS_FILE=/aws/credentials
      - AWS_CONFIG_FILE=/aws/config
    healthcheck:
      # /ready (not /health) so the check actually reaches DynamoDB. /health
      # returns 200 even when the data store is unreachable, which would report
      # this container as healthy while every request to it fails.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - cloudmart

  # ---- Order Service (Node.js/Express) ----
  order-service:
    build: ./services/order-service
    container_name: cloudmart-order
    ports:
      - "8002:8002"
    # LOCAL DEVELOPMENT ONLY - see the note on product-service above.
    volumes:
      - type: bind
        source: ${USERPROFILE}/.aws
        target: /aws
        read_only: true
    environment:
      - PORT=8002
      - PRODUCT_SERVICE_URL=http://product-service:8001
      - QUEUE_BACKEND=sqs              # memory | sqs | pubsub | servicebus
      - AWS_REGION=${AWS_REGION}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL}
      - AWS_SHARED_CREDENTIALS_FILE=/aws/credentials
      - AWS_CONFIG_FILE=/aws/config
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - cloudmart

  # ---- User Service (Python/Flask) ----
  user-service:
    build: ./services/user-service
    container_name: cloudmart-user
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - FLASK_DEBUG=true
      - DB_BACKEND=memory              # Change to postgres for cloud
      - JWT_SECRET=cloudmart-dev-secret-change-in-production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - cloudmart

  # ---- Notification Service (Node.js) ----
  notification-service:
    build: ./services/notification-service
    container_name: cloudmart-notification
    ports:
      - "8004:8004"
    # LOCAL DEVELOPMENT ONLY - see the note on product-service above.
    volumes:
      - type: bind
        source: ${USERPROFILE}/.aws
        target: /aws
        read_only: true
    environment:
      - PORT=8004
      - ORDER_SERVICE_URL=http://order-service:8002
      - QUEUE_BACKEND=sqs              # memory | sqs | pubsub | servicebus
      - EMAIL_BACKEND=console          # memory | ses | sendgrid
      - POLL_INTERVAL_MS=5000
      - AWS_REGION=${AWS_REGION}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL}
      - AWS_SHARED_CREDENTIALS_FILE=/aws/credentials
      - AWS_CONFIG_FILE=/aws/config
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8004/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - cloudmart

  # ---- Frontend (React + Nginx) ----
  frontend:
    build: ./services/frontend
    container_name: cloudmart-frontend
    ports:
      - "3000:80"
    depends_on:
      - product-service
      - order-service
      - user-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - cloudmart

networks:
  cloudmart:
    driver: bridge
