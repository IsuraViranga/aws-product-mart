apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {}   # ALB source IPs are node IPs — allow all; SG restricts to ALB only
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: product-service
    ports:
    - port: {{ .Values.ports.productService }}
  - to:
    - podSelector:
        matchLabels:
          app: order-service
    ports:
    - port: {{ .Values.ports.orderService }}
  - to:
    - podSelector:
        matchLabels:
          app: user-service
    ports:
    - port: {{ .Values.ports.userService }}
  - ports:
    - port: 53
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-product-service
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: product-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: order-service
    ports:
    - port: {{ .Values.ports.productService }}
  egress:
  - ports:
    - port: 443    # DynamoDB via VPC Gateway Endpoint
  - ports:
    - port: 53
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-service
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: {{ .Values.ports.orderService }}
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: product-service
    ports:
    - port: {{ .Values.ports.productService }}
  - ports:
    - port: 443    # SQS endpoint
  - ports:
    - port: 53
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-user-service
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - port: {{ .Values.ports.userService }}
  egress:
  - ports:
    - port: 5432   # RDS PostgreSQL
  - ports:
    - port: 443    # Secrets Manager via VPC Interface Endpoint
  - ports:
    - port: 53
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification-service
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - port: {{ .Values.ports.notificationService }}   # kubelet health check only
  egress:
  - ports:
    - port: 443    # SQS + SES (both HTTPS)
  - ports:
    - port: 53
      protocol: UDP
