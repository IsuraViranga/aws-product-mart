# Default values — overridden by values-prod.yaml or values-staging.yaml

namespace: cloudmart-prod

# Single replica — this is a queue consumer, not a stateless HTTP service
replicaCount: 1

image:
  registry: 175342148842.dkr.ecr.us-east-1.amazonaws.com
  repository: cloudmart/notification-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8004

# Lower baseline than HTTP services — mostly idle between SQS polls
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

configMap:
  name: cloudmart-config

serviceAccount:
  name: notification-service-sa
  roleArn: arn:aws:iam::175342148842:role/cloudmart-notification-service

pdb:
  enabled: true

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
