# Default values — overridden by values-prod.yaml or values-staging.yaml

namespace: cloudmart-prod

replicaCount: 2

image:
  registry: 175342148842.dkr.ecr.us-east-1.amazonaws.com
  repository: cloudmart/order-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8002

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

configMap:
  name: cloudmart-config

awsRegion: us-east-1

serviceAccount:
  name: order-service-sa
  roleArn: arn:aws:iam::175342148842:role/cloudmart-order-service

pdb:
  enabled: true
  minAvailable: 1

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 60

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
