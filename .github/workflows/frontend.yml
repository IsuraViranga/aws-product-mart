name: Frontend - Build & Push to ECR

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloudmart/frontend
  SERVICE_PATH: services/frontend

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm install

      - name: Run tests
        working-directory: ${{ env.SERVICE_PATH }}
        env:
          CI: "true"
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            "$SERVICE_PATH"
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        env:
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          sed "s|$REGISTRY/$ECR_REPOSITORY:latest|$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" \
            k8s/frontend.yaml | kubectl apply -f -

          if ! kubectl rollout status deployment/frontend -n cloudmart-prod --timeout=300s; then
            echo "Rollout failed. Collecting diagnostics..."
            kubectl get deployment frontend -n cloudmart-prod -o wide
            kubectl get rs -n cloudmart-prod | grep frontend || true
            kubectl get pods -n cloudmart-prod -l app=frontend -o wide || true
            kubectl describe deployment frontend -n cloudmart-prod || true
            kubectl describe pods -n cloudmart-prod -l app=frontend || true
            kubectl logs -n cloudmart-prod -l app=frontend --tail=200 || true
            kubectl get events -n cloudmart-prod --sort-by='.lastTimestamp' | tail -30 || true
            exit 1
          fi

